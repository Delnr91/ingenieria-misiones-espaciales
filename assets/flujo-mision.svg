<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="t d"><title id="t">Del problema a la verificación</title><desc id="d">Cinco cajas conectadas: pregunta, objetivos, requisitos, alternativas y verificación. Las decisiones se pueden revisar.</desc><rect width="1000" height="220" rx="20" fill="#10233e"/><g font-family="DejaVu Sans,Arial" font-size="21" text-anchor="middle"><g fill="#e9f6fa"><rect x="20" y="62" width="165" height="85" rx="12"/><rect x="215" y="62" width="165" height="85" rx="12"/><rect x="410" y="62" width="165" height="85" rx="12"/><rect x="605" y="62" width="165" height="85" rx="12"/><rect x="800" y="62" width="180" height="85" rx="12"/></g><g fill="#143a50"><text x="102" y="111">Pregunta</text><text x="297" y="111">Objetivos</text><text x="492" y="111">Requisitos</text><text x="687" y="111">Alternativas</text><text x="890" y="111">Verificación</text></g><g fill="#fff" font-size="27"><text x="200" y="113">→</text><text x="395" y="113">→</text><text x="590" y="113">→</text><text x="785" y="113">→</text></g><text x="500" y="190" fill="#fff" font-size="18">El diseño es iterativo: revisa supuestos y decisiones.</text></g></svg>